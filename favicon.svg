<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="32" height="32" rx="4" fill="#0d0d0d"/>
  <path d="M 7 12 L 12 16 L 7 20"
        stroke="#33ff66" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <rect x="19.5" y="20" width="5" height="1.5" rx="0.3" fill="#888"/>
  <rect x="20.3" y="22" width="3.4" height="1.5" rx="0.3" fill="#888"/>
  <g filter="url(#glow)">
    <ellipse cx="22" cy="13.5" rx="5.5" ry="6" fill="#ffd633"/>
    <animate attributeName="opacity" values="1;0.2;1"
             dur="1.4s" repeatCount="3" fill="freeze"/>
  </g>
</svg>
